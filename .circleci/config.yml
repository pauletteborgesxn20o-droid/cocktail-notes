            echo "staging complete; file length=$(wc -c </tmp/handoff/log.txt)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - log.txt
  Beta_Launch_Pipeline3_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: flag green
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=256;i++)printf "%c", 32+(i%95)}' | wc -c; true ; } > /tmp/handoff/secondary_job_output.log
            echo "staging complete; file length=$(wc -c </tmp/handoff/secondary_job_output.log)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - secondary_job_output.log
  A_phoenix-rev_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: hopefully
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; dd if=/dev/zero bs=1M count=12 2>/dev/null | sha256sum; true ; } > /tmp/handoff/event.log
            echo "staging complete; file length=$(wc -c </tmp/handoff/event.log)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - event.log
