version: 2.1

jobs:
  step1_nightly-v9:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: air dry
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/handoff/passoff.ok; true
            echo "staging complete; file length=$(wc -c </tmp/handoff/passoff.ok)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - passoff.ok
  nightly-v9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Pull from workspace
          command: |
            test -f /tmp/handoff/passoff.ok && echo found || echo missing
      - run:
          name: Pull repository
          command: git clone --depth 2 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore snapshot
          command: tar --extract --bzip2 --file=content.tar.bz2
      - run:
          command: g++ --version
      - run:
          no_output_timeout: 74m
          command: bash -c "./gateway"
  env_java17-fmt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: monsoon
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; hexdump -C /etc/hostname 2>/dev/null | head -1 || od -An -c /etc/hostname | head -1; true ; } > /tmp/handoff/step-20.txt
            echo "staging complete; file length=$(wc -c </tmp/handoff/step-20.txt)"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
